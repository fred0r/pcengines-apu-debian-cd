profiles="manual"
auto_profiles="manual"
build_profiles="manual"
locale="en_US.UTF-8"
keyboard="us"
mirror_components="main contrib non-free non-free-firmware"
use_security_mirror=true
ARCH=amd64
ARCHES="amd64"
use_serial_console=true
serial_console_speed=115200
serial_console_opts="ttyS0,115200n8"
BOOT_TIMEOUT=50
kernel_packages="linux-image-amd64"
vga_normal=true
# trixie dropped the i386 installer; don't pull 32-bit UEFI boot files
DISABLE_UEFI_32=1
# The APU (coreboot/SeaBIOS) is BIOS-only: build a BIOS-only ISO
BOOT_METHODS="BIOS"
# make the installer auto-boot the text "Install" entry (see the hook)
DISC_END_HOOK="$PWD/misc/trixie-boot-fix.sh"


## Things you may want to change ##
debian_mirror="http://deb.debian.org/debian"
security_mirror="http://security.debian.org"
KERNEL_PARAMS="language=en country=DE locale=en_US.UTF-8"
